<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Reset Password — Usahaku by KetanTech</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .logo-text p {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #fbbf24;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .field-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    input[type="text"]::placeholder {
      color: #475569;
    }

    .field-hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }

    .generate-btn {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      transition: opacity 0.15s;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:active { opacity: 0.8; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-box {
      display: none;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .result-box.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .result-code {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .result-meta {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .result-meta span {
      color: #94a3b8;
    }

    .copy-btn {
      width: 100%;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #e2e8f0;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      transition: all 0.15s;
    }

    .copy-btn:hover { background: #475569; }
    .copy-btn.copied { background: #166534; color: #86efac; }

    .wa-template {
      margin-top: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
    }

    .wa-template-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .wa-text {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .copy-wa-btn {
      margin-top: 10px;
      width: 100%;
      background: #14532d;
      border: none;
      border-radius: 6px;
      color: #86efac;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px;
      transition: all 0.15s;
    }

    .copy-wa-btn:hover { background: #166534; }
    .copy-wa-btn.copied { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔑</div>
      <div class="logo-text">
        <h1>Generator Reset Password</h1>
        <p>Usahaku by KetanTech — Internal Tool</p>
      </div>
    </div>

    <div class="warning">
      ⚠️ File ini RAHASIA. Jangan dibagikan ke pelanggan.<br>
      Kode yang dihasilkan berlaku <strong>24 jam</strong> sejak dibuat.
    </div>

    <div class="field-group">
      <div class="field-label">Username Pelanggan</div>
      <input
        type="text"
        id="username-input"
        placeholder="Contoh: tokopaijo"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <div class="field-hint">Ketik username akun pelanggan yang ingin direset passwordnya.</div>
    </div>

    <button class="generate-btn" id="generate-btn" onclick="generate()">
      🔑 Generate Kode Reset
    </button>

    <div class="result-box" id="result-box">
      <div class="result-label">Kode Reset Password</div>
      <div class="result-code" id="result-code"></div>
      <div class="result-meta" id="result-meta"></div>
      <button class="copy-btn" id="copy-btn" onclick="copyCode()">Salin Kode</button>

      <div class="wa-template">
        <div class="wa-template-label">Template Pesan WhatsApp</div>
        <div class="wa-text" id="wa-text"></div>
        <button class="copy-wa-btn" id="copy-wa-btn" onclick="copyWa()">Salin Pesan WA</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // RAHASIA — Harus sama dengan SECRET di server
    // ============================================================
    const SECRET = "BUKUHUTANG_LICENSE_SECRET_V1_2024_OFFLINE";
    // ============================================================

    let lastCode = "";
    let lastWaText = "";

    async function hmacSha256(secret, data) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw",
        enc.encode(secret),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", key, enc.encode(data));
      return new Uint8Array(sig);
    }

    async function generate() {
      const username = document.getElementById("username-input").value.trim().toLowerCase();
      if (!username) {
        document.getElementById("username-input").focus();
        alert("Masukkan username pelanggan terlebih dahulu.");
        return;
      }

      const btn = document.getElementById("generate-btn");
      btn.disabled = true;
      btn.textContent = "Membuat kode...";

      try {
        const expiresAt = new Date();
        expiresAt.setHours(expiresAt.getHours() + 24);
        const expiryTs = Math.floor(expiresAt.getTime() / 1000);

        const payload = `PWRESET:${username}:${expiryTs}`;
        const hmac = await hmacSha256(SECRET, payload);

        const buf = new Uint8Array(8);
        const view = new DataView(buf.buffer);
        view.setUint32(0, expiryTs, false);
        buf[4] = hmac[0];
        buf[5] = hmac[1];
        buf[6] = hmac[2];
        buf[7] = hmac[3];

        const hex = Array.from(buf)
          .map(b => b.toString(16).padStart(2, "0"))
          .join("")
          .toUpperCase();
        const parts = hex.match(/.{1,4}/g);
        const code = "RST-" + parts.join("-");

        lastCode = code;

        const expStr = expiresAt.toLocaleDateString("id-ID", {
          weekday: "long", day: "numeric", month: "long", year: "numeric",
          hour: "2-digit", minute: "2-digit"
        });

        lastWaText = `Halo, berikut kode reset password untuk akun *${username}* di aplikasi Usahaku:\n\n*${code}*\n\nCara pakai:\n1. Buka aplikasi Usahaku\n2. Klik "Lupa password?" di halaman login\n3. Masukkan username: *${username}*\n4. Masukkan kode di atas\n5. Buat password baru\n\nKode ini berlaku sampai *${expStr}*.\nHubungi kami jika butuh bantuan.`;

        document.getElementById("result-code").textContent = code;
        document.getElementById("result-meta").innerHTML =
          `Untuk username: <span>${username}</span><br>` +
          `Berlaku sampai: <span>${expStr}</span>`;
        document.getElementById("wa-text").textContent = lastWaText;

        const resultBox = document.getElementById("result-box");
        resultBox.classList.add("visible");

        document.getElementById("copy-btn").textContent = "Salin Kode";
        document.getElementById("copy-btn").classList.remove("copied");
        document.getElementById("copy-wa-btn").textContent = "Salin Pesan WA";
        document.getElementById("copy-wa-btn").classList.remove("copied");

      } finally {
        btn.disabled = false;
        btn.textContent = "🔑 Generate Kode Reset";
      }
    }

    async function copyCode() {
      try {
        await navigator.clipboard.writeText(lastCode);
        const btn = document.getElementById("copy-btn");
        btn.textContent = "Tersalin ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Salin Kode";
          btn.classList.remove("copied");
        }, 2000);
      } catch {
        alert("Salin manual:\n\n" + lastCode);
      }
    }

    async function copyWa() {
      try {
        await navigator.clipboard.writeText(lastWaText);
        const btn = document.getElementById("copy-wa-btn");
        btn.textContent = "Tersalin ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Salin Pesan WA";
          btn.classList.remove("copied");
        }, 2000);
      } catch {
        alert("Salin manual pesan di atas.");
      }
    }

    document.getElementById("username-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") generate();
    });
  </script>
</body>
</html>
