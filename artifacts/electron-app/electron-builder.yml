appId: com.ketantech.usahaku
productName: Usahaku
copyright: Copyright © 2025 KetanTech
buildVersion: "1.0.2"

directories:
  output: release
  buildResources: assets

files:
  - build/**/*
  - package.json

extraResources:
  - from: ../api-server/dist
    to: backend/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ./node_modules/better-sqlite3
    to: backend/node_modules/better-sqlite3
    filter:
      - "**/*"
  - from: ./assets/bindings-stub
    to: backend/node_modules/bindings
    filter:
      - "**/*"
  - from: ../hutang-app/dist/public
    to: frontend
    filter:
      - "**/*"

asarUnpack:
  - "**/*.node"

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  artifactName: "Usahaku-Setup-${version}.exe"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Usahaku
  deleteAppDataOnUninstall: false
  license: null
  installerLanguages:
    - en_US

npmRebuild: true
asar: true

publish:
  provider: github
  owner: ketanvpn
  repo: usahaku-app
  releaseType: release
