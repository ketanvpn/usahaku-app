appId: com.bukuhutang.app
productName: Buku Hutang
copyright: Copyright © 2025 Buku Hutang
buildVersion: "1.0.0"

directories:
  output: release
  buildResources: assets

files:
  - build/**/*
  - package.json

extraResources:
  - from: ../api-server/dist
    to: backend/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../api-server/node_modules/better-sqlite3
    to: backend/node_modules/better-sqlite3
    filter:
      - "**/*"
  - from: ../hutang-app/dist/public
    to: frontend
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  artifactName: "BukuHutang-Setup-${version}.exe"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Buku Hutang
  deleteAppDataOnUninstall: false
  license: null
  installerLanguages:
    - en_US

npmRebuild: true
asar: true

publish: null
