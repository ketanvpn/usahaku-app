appId: com.bukuhutang.app
productName: Buku Hutang
copyright: Copyright © 2025 Buku Hutang

directories:
  output: release
  buildResources: assets

files:
  - build/**/*
  - package.json

extraResources:
  - from: ../api-server/dist
    to: backend/dist
    filter:
      - "**/*"
  - from: ../api-server/node_modules/better-sqlite3
    to: backend/node_modules/better-sqlite3
    filter:
      - "**/*"
  - from: ../hutang-app/dist/public
    to: frontend
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Buku Hutang
  installerHeaderIcon: assets/icon.ico

npmRebuild: true

asar: true
