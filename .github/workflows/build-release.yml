name: Build & Release Windows

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sesuaikan versi package.json dengan tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG → Versi: $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'artifacts/electron-app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Versi diset ke:', '$VERSION');
          "

      - name: Install semua dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer Windows (.exe) dan upload otomatis ke Release
        run: pnpm run dist:win
        working-directory: artifacts/electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
