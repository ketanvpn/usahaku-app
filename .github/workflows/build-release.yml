name: Build & Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-windows:
    name: Verify Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sesuaikan versi package.json dengan tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG → Versi: $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'artifacts/electron-app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Versi diset ke:', '$VERSION');
          "

      - name: Install semua dependencies
        run: pnpm install --frozen-lockfile

      - name: Pastikan dependency workspace DB terpasang
        run: pnpm --filter @workspace/db install --frozen-lockfile

      - name: Quality gate - Build DB package
        run: pnpm --filter @workspace/db run build

      - name: Quality gate - Build backend (API server)
        run: pnpm --filter @workspace/api-server run build

      - name: Quality gate - Build frontend (React app)
        run: pnpm --filter @workspace/hutang-app run build:electron

  release-windows:
    name: Build Installer and Upload
    runs-on: windows-latest
    needs: verify-windows
    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight - Validasi format tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag release tidak valid: '$TAG'. Gunakan format vX.Y.Z (contoh v1.0.59)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sesuaikan versi package.json dengan tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG → Versi: $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'artifacts/electron-app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Versi diset ke:', '$VERSION');
          "

      - name: Install semua dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer Windows (.exe) dan upload otomatis ke Release
        run: pnpm run dist:win
        working-directory: artifacts/electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
