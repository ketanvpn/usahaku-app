name: Build & Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:

# ─── Catatan resilience build (lihat juga PANDUAN-RILIS-VERSI-BARU.md) ─────
# v1.0.87 build pernah gagal karena GitHub menggeser image `windows-latest`
# ke versi yang punya Visual Studio 2026 (versi 18), yang belum dikenali
# `node-gyp@11.x`. `better-sqlite3` jatuh ke kompilasi native dan gagal.
#
# Strategi resilience yang sekarang diterapkan (defense in depth):
#  1. Pin runner ke `windows-2022` — punya VS 2022 Build Tools yang stabil
#     dan masih support `node-gyp@11.x`.
#  2. Setup MSBuild manual via `microsoft/setup-msbuild@v2` — pasang ulang
#     toolchain dengan path yang explicit, tidak tergantung default image.
#  3. Set env `npm_config_msvs_version=2022` supaya node-gyp tahu versi mana
#     yang harus dipakai (skip step "find VS" yang fragile).
#  4. Set `npm_config_build_from_source=false` (default) + retry helper untuk
#     `pnpm install` supaya prebuild-install dapat kesempatan kedua kalau
#     download timeout.
#
# Kalau `windows-2022` di-deprecate: tinggal ganti ke runner berikutnya tanpa
# perlu utak-atik step lain karena MSBuild + msvs_version sudah explicit.
# ────────────────────────────────────────────────────────────────────────

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Stabilkan toolchain native build di runner Windows.
  # Lihat catatan resilience di atas untuk konteks.
  npm_config_msvs_version: "2022"

jobs:
  verify-windows:
    name: Verify Quality Gate
    runs-on: windows-2022

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup MSBuild (untuk node-gyp native rebuild)
        uses: microsoft/setup-msbuild@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sesuaikan versi package.json dengan tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG → Versi: $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'artifacts/electron-app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Versi diset ke:', '$VERSION');
          "

      - name: Install semua dependencies (dengan retry kalau prebuild-install timeout)
        shell: pwsh
        run: |
          # Retry up to 3x karena `prebuild-install` (yang dipakai better-sqlite3)
          # bisa timeout download binary kalau jaringan runner lagi tidak stabil.
          # Kalau sukses di percobaan pertama, retry tidak terjadi (no-op).
          #
          # Catatan PowerShell: pakai `${var}` di dalam string yang diikuti
          # tanda baca seperti `:` supaya tidak diparse sebagai scope variable
          # (`$env:PATH` style). `$i` aman karena hanya diikuti spasi.
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Attempt $i of ${maxAttempts}: pnpm install --frozen-lockfile"
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Install sukses di percobaan ke-$i"
              break
            }
            if ($i -eq $maxAttempts) {
              Write-Host "Install gagal setelah ${maxAttempts} percobaan"
              exit 1
            }
            Write-Host "Install gagal, retry dalam 5 detik..."
            Start-Sleep -Seconds 5
          }

      - name: Pastikan dependency workspace DB terpasang
        run: pnpm --filter @workspace/db install --frozen-lockfile

      - name: Quality gate - Build DB package
        run: pnpm --filter @workspace/db run build

      - name: Quality gate - Build backend (API server)
        run: pnpm --filter @workspace/api-server run build

      - name: Quality gate - Build frontend (React app)
        run: pnpm --filter @workspace/hutang-app run build:electron

  release-windows:
    name: Build Installer and Upload
    runs-on: windows-2022
    needs: verify-windows
    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup MSBuild (untuk node-gyp native rebuild)
        uses: microsoft/setup-msbuild@v2

      - name: Preflight - Validasi format tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag release tidak valid: '$TAG'. Gunakan format vX.Y.Z (contoh v1.0.59)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sesuaikan versi package.json dengan tag release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG → Versi: $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'artifacts/electron-app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Versi diset ke:', '$VERSION');
          "

      - name: Install semua dependencies (dengan retry kalau prebuild-install timeout)
        shell: pwsh
        run: |
          # Lihat catatan PowerShell di job verify-windows.
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Attempt $i of ${maxAttempts}: pnpm install --frozen-lockfile"
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Install sukses di percobaan ke-$i"
              break
            }
            if ($i -eq $maxAttempts) {
              Write-Host "Install gagal setelah ${maxAttempts} percobaan"
              exit 1
            }
            Write-Host "Install gagal, retry dalam 5 detik..."
            Start-Sleep -Seconds 5
          }

      - name: Build installer Windows (.exe) dan upload otomatis ke Release
        run: pnpm run dist:win
        working-directory: artifacts/electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
